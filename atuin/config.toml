# Atuin client configuration.
# Account credentials, encryption keys, and sync sessions stay outside the repo.

# Keep the first rollout local-only. Enable sync explicitly after reviewing the
# history that will be uploaded to the selected Atuin server.
auto_sync = false
update_check = false

# Use the daemon's in-memory index for interactive history search.
search_mode = "daemon-fuzzy"
workspaces = true
filter_mode = "workspace"

# Require an explicit edit/confirmation step before executing a result.
enter_accept = false

# Built-in credential matching remains enabled. Add project-specific patterns
# to history_filter only when they are known and safe to version.
secrets_filter = true

[daemon]
enabled = true
autostart = true

# AI remains opt-in. Enabling it later should also review its capabilities.
[ai]
enabled = false
